services:
  mongodb:
    image: mongo:7-jammy
    container_name: pulsewatch-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsewatch-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/pulsewatch
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      JWT_SECRET: super-secure-jwt-secret-key-at-least-32-characters-long
      JWT_EXPIRES_IN: 7d
      START_WORKER_IN_PROCESS: 'true'
      WORKER_POLL_INTERVAL_MS: 3000
      WORKER_CONCURRENCY: 5
      WORKER_LEASE_DURATION_MS: 30000
      RETENTION_DAYS: 30
      ENABLE_DEMO_ROUTES: 'true'
      LOG_LEVEL: info

volumes:
  mongo_data:
